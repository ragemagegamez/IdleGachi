/* Desktop layout: applies whenever the player picks Desktop, at any window width (itch.io embeds are often narrower than 900px).

 if(a.t=='egg')return{pv:gEgg(a.v),tx:VAR[a.v].n+' ('+VAR[a.v].d+')'};

/* ---------- Rewards ---------- */
function ggMat(band){const reach=Math.max(1,...Object.keys(SK).map(k=>lv(S.sk[k]))),r=Math.random(),
 sk=r<.3?['mine','fish','forage','woodcut']:r<.6?['cook']:r<.85?['smith','craft']:['alch'],cap=reach+[10,20,30][band];
 let pool=IT.filter(i=>sk.includes(i.sk)&&i.lv<=cap);if(!pool.length)pool=IT.filter(i=>sk.includes(i.sk)).slice(0,2);
 const fl=[0,cap*.45,cap*.7][band],hi=pool.filter(i=>i.lv>=fl);if(hi.length)pool=hi;
 const it=pool[Math.random()*pool.length|0],raw=['mine','fish','forage','woodcut'].includes(it.sk),base=raw?gRand(10,20):it.sk=='cook'?gRand(4,8):gRand(3,6);
 return{id:it.id,n:Math.max(1,Math.round(base*(1+band*.5)*(1-Math.min(.5,it.lv/200))))}}
function ggCosPool(min){const p=[];Object.keys(COS).forEach(cat=>COS[cat].forEach(i=>{if(i.rv||i.rot||i.ev||S.own[i.id])return;
 const t=i.gx?i.t:i.c>1000?3:i.c>400?2:i.c>100?1:0;if((i.gx||i.c>0)&&t>=min)p.push({cat,i,t})}));return p}
function ggBuild(rank){const tier=ggTier(rank);if(!tier)return null;const R=GGR[tier],att=[{t:'title',id:tier}],m={},used={};
 for(let i=0;i<R.mats;i++){const x=ggMat(R.band);m[x.id]=(m[x.id]||0)+x.n}
 Object.keys(m).forEach(id=>att.push({t:'item',id,n:m[id]}));
 for(let i=0;i<R.cos;i++){const p=ggCosPool(R.min).filter(x=>!used[x.i.id]);
  if(p.length){const x=p[Math.random()*p.length|0];used[x.i.id]=1;att.push({t:'cos',id:x.i.id})}else att.push({t:'gp',n:R.min>=2?600:200})}
 if(R.shell)att.push({t:'cos',id:'ev_drake'});if(R.egg)att.push({t:'egg',v:'gold'});
 return{tier,att}}

/* ---------- Leaderboard (Supabase, see supabase_gachi_gambit.sql) ---------- */
const GB={d:null,err:'',busy:0,t:0};
async function ggPush(force){const g=gg();if(!chOK()||Date.now()>GG.end+GG.settle||Date.now()<GG.start)return;const v=Math.floor(g.dmg);if(!force&&v<=g.sent)return;if(v<=0)return;
 try{await sbRest('POST','rpc/gambit_submit',{event_id_:GG.id,damage_:v},'return=minimal');g.sent=Math.max(g.sent,v)}catch(e){if(e.code==404)GB.err='setup'}}
async function ggBoard(force){if(GB.busy)return;if(!chOK()){GB.err='signin';dirty=true;return}if(!force&&Date.now()-GB.t<25000)return;GB.busy=1;
 try{await ggPush(true);const r=await sbRest('POST','rpc/gambit_board',{event_id_:GG.id}),d=Array.isArray(r)?r[0]:r;if(!d||!d.top)throw new Error('bad');
  GB.d=d;GB.err='';GB.t=Date.now();const s=Date.parse(d.starts_at),e=Date.parse(d.ends_at);if(s)GG.start=s;if(e)GG.end=e}
 catch(e){GB.err=e.code==404?'setup':'offline';GB.t=Date.now()}
 GB.busy=0;dirty=true}
async function ggFinal(){if(!ACC||!S||!chOK()||Date.now()<GG.end+GG.settle)return;const g=gg();if(g.mailed||GB.busy)return;
 await ggBoard(true);const d=GB.d;if(!d||!d.final||g.mailed)return;const me=d.me;
 if(!me||me.claimed){g.mailed=1;save(true);return}
 const rank=+me.rank,rw=ggBuild(rank);
 if(rw)mailAdd({id:GG.id+'-r',from:'Gachi HQ',subj:'Gachi Gambit rewards: rank #'+rank,body:'The '+GG.boss+' has left, and you finished #'+rank+' with '+gN(me.damage)+' damage. Congratulations!\n\nYour '+TITLES[rw.tier].n+' title and rewards are attached. Claim them below.',att:rw.att});
 else mailAdd({id:GG.id+'-t',from:'Gachi HQ',subj:'Gachi Gambit results',body:'Thank you for taking on the '+GG.boss+'! You finished #'+rank+' with '+gN(me.damage)+' damage. The top 100 players earn rewards, so keep climbing next time.'});
 g.mailed=1;msg('Gachi Gambit results are in! Check your Mail.');sfx('lvl',0,true);save(true);
 try{await sbRest('POST','rpc/gambit_claim',{event_id_:GG.id},'return=minimal')}catch(e){}}

 if(a=='gg-name')return ggNameOv();

   ov('ggs').style.display='none';GB.t=0;ggBoard(true)}
  catch(e){const m=(e.message||'').trim();n.textContent=m=='taken'?'Somebody already has that name.':m=='badname'?'That name is not allowed.':m=='wait'?'Wait a bit before changing it again.':'Could not save the name. Try again.'}return}

/* ===== fixes: stop double-tap / pinch zoom and stuck focus on mini game buttons ===== */
(function(){
 let lastTouch=0;
 document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<350&&e.target.closest&&e.target.closest('button,#bpad,#rvpad,.bt,canvas'))e.preventDefault();lastTouch=n},{passive:false});
 document.addEventListener('dblclick',e=>{if(e.target.closest&&e.target.closest('button,#bpad,#rvpad,.bt'))e.preventDefault()},{passive:false});
 ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
 // drop focus/hover leftovers after a press so nothing keeps blinking
 document.addEventListener('pointerup',e=>{const b=e.target.closest&&e.target.closest('.bt button,#bpad button,#rvpad button');if(b)setTimeout(()=>{try{b.blur()}catch(x){}},0)});
})();
